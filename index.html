<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxh1sIk_ZIeHZatKn6n_SvUQhaJtSBLt_0qCMf0Nd45o64L1myOZ8mEnXEk4dqFF9WC/exec";

    async function fetchData() {
        try {
            const res = await fetch(SCRIPT_URL);
            const data = await res.json();
            
            let tableHTML = "";
            let completed = 0, weekly = 0, complaints = 0;

            data.forEach((row, index) => {
                if(row["Status"] === "Completed") completed++;
                if(row["Frequency"] === "weekly") weekly++;
                if(row["Complaint"] && row["Complaint"] !== "") complaints++;

                tableHTML += `
                    <tr>
                        <td>${index + 1}</td>
                        <td class="fw-bold">${row["Equipment ID"] || ''}</td>
                        <td>${row["Equipment Type"] || ''}</td>
                        <td>${row["Location / Area"] || ''}</td>
                        <td><span class="badge bg-secondary">${row["Frequency"] || ''}</span></td>
                        <td>${row["Last Service Date"] ? new Date(row["Last Service Date"]).toLocaleDateString() : ''}</td>
                        <td class="fw-bold text-primary">${row["Next Due Date"] ? new Date(row["Next Due Date"]).toLocaleDateString() : ''}</td>
                        <td><span class="badge ${row["Status"] === 'Completed' ? 'badge-completed' : 'badge-pending'}">${row["Status"] || 'Pending'}</span></td>
                        <td class="text-danger fw-semibold">${row["Complaint"] || '-'}</td>
                        <td class="text-success fw-semibold">${row["Complaint Resolved"] || '-'}</td>
                    </tr>
                `;
            });

            document.getElementById("sheetDataTable").innerHTML = tableHTML;
            document.getElementById("totalUnits").innerText = data.length;
            document.getElementById("completedCount").innerText = completed;
            document.getElementById("weeklyCount").innerText = weekly;
            document.getElementById("complaintCount").innerText = complaints;

        } catch (err) {
            console.error("Fetch Error: ", err);
            document.getElementById("sheetDataTable").innerHTML = `<tr><td colspan="10" class="text-center text-danger py-4">Error loading data. Double check Web App URL permissions.</td></tr>`;
        }
    }

    fetchData();
</script>
